<div id="app">
<header>
  <h1>HORA PICO</h1>
  <p id="m">¡Corré, ya empieza el Build &amp; Pitch!</p>
  <p id="tag"></p>
  <div class="top">

  <label id="barT">TIEMPO <em id="clock">6:30</em><b><i id="fillT"></i></b></label>
  <label id="barQ">PUNTOS<strong id="q">0</strong></label>
</div>
<canvas id="c" width="480" height="270" aria-hidden="true"></canvas>
<p id="joke" aria-live="polite"></p>
<dialog id="panel"></dialog>
<div id="pad">
  <button type="button" id="bL" aria-label="Izquierda"></button>
  <button type="button" id="bA" aria-label="Acelerar"><i id="fillB"></i></button>
  <button type="button" id="bR" aria-label="Derecha"></button>
  <button type="button" id="bB" aria-label="Frenar"></button>
</div>
</div>
<footer>
  <p>Arcade chapín gratis para el navegador: moto, tres carriles y el tráfico de la hora pico en Guatemala.</p>
</footer>
