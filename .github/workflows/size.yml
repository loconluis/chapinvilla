name: size

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # el build va antes de los tests: test/pack.test.js inspecciona dist/
      - run: npm run build
      - run: npm test
      - run: npm run size
      - name: published file matches commit
        run: cmp dist/index.html index.html
